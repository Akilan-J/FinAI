services:
  postgres:
    image: postgres:16-alpine
    container_name: finai_postgres
    restart: always
    environment:
      POSTGRES_USER: finai_user
      POSTGRES_PASSWORD: finai_password
      POSTGRES_DB: finai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Runs OCR receipt processing asynchronously. Opt-in via profile since it
  # needs backend/.env (API keys) to do real work — start it with:
  #   docker compose --profile worker up -d celery_worker
  # (CELERY_ALWAYS_EAGER=True still lets OCR run in-process without this,
  # e.g. for a quick local try without Docker.)
  celery_worker:
    build:
      context: ./backend
    container_name: finai_celery_worker
    restart: always
    profiles:
      - worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://finai_user:finai_password@postgres:5432/finai_db
      REDIS_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "False"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
